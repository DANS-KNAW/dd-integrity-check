#
# dd-integrity-check configuration file
#
server:
  applicationContextPath: /
  adminContextPath: /
  applicationConnectors:
    - type: http
      port: 20390
  adminConnectors:
    - type: http
      port: 20391
  # Logs the requests to the Jetty http server
  requestLog:
    appenders:
      - type: file
        archive: false
        timeZone: system
        currentLogFilename: /var/opt/dans.knaw.nl/log/dd-integrity-check/request.log

database:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://dev.archaeology.datastations.nl:5432/dd_integrity_check_local_test
  user: dd_integrity_check_local_test
  password: dd_integrity_check_local_test
  properties:
    charSet: UTF-8
    hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate.hbm2ddl.auto: update

dataverse:
  baseUrl: https://test.archaeology.datastations.nl
  apiKey: 'changeme'

integrityCheck:
  inbox: data/inbox
  outbox: data/outbox
  startAfter: '06:00'
  startBefore: '23:00'
  chunkSize: 1G
  minimalFrequency: 30days
  pollingInterval: 10ms
  taskExecutor:
    nameFormat: "integrity-check-worker-%d"
    maxQueueSize: 5000
    minThreads: 3
    maxThreads: 3
    keepAliveTime: 60 seconds

#
# See https://www.dropwizard.io/en/latest/manual/configuration.html#logging
#
logging:
  level: INFO
  appenders:
    - type: file
      archive: false
      timeZone: system
      currentLogFilename: /var/opt/dans.knaw.nl/log/dd-integrity-check/dd-integrity-check.log
    - type:  console
      # Used in combination with journald, which already adds the timestamp
      logFormat: "%-5p %c{0} [%t]: %m%n%dwREx"
  loggers:
    'nl.knaw.dans.integritycheck': DEBUG
    'nl.knaw.dans.integritycheck.core.inbox.IntegrityCheckInboxTask': INFO
    'org.hibernate.engine.internal.StatisticalLoggingSessionEventListener': 'OFF'
