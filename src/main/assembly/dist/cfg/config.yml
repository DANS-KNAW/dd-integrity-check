#
# dd-integrity-check configuration file
#
server:
  applicationContextPath: /
  adminContextPath: /
  applicationConnectors:
    - type: http
      port: 20390
  adminConnectors:
    - type: http
      port: 20391
  # Logs the requests to the Jetty http server
  requestLog:
    appenders:
      - type: file
        archive: false
        timeZone: system
        currentLogFilename: /var/opt/dans.knaw.nl/log/dd-integrity-check/request.log

database:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://localhost:5432/dd_integrity_check
  user: dd_integrity_check
  password: dd_integrity_check
  # N.B. We are logging validation errors, but since connections are validated before being used, automatic recovery
  # should still work, so don't get spooked by the error messages in the log when postgresql is restarted.
  logValidationErrors: true
  validationQuery: "SELECT 1"
  validationQueryTimeout: 3s
  checkConnectionWhileIdle: true
  checkConnectionOnConnect: true
  checkConnectionOnReturn: true
  checkConnectionOnBorrow: true
  evictionInterval: 10s
  minIdleTime: 1 minute
  properties:
    charSet: UTF-8
    hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate.hbm2ddl.auto: update

dataverse:
  baseUrl: http://localhost:8080
  apiKey: 'secret-api-key'

integrityCheck:
  # Where and how often to look for CSVs containing file records and when to schedule
  fileRecords:
    inbox: /var/opt/dans.knaw.nl/tmp/integrity-check/inbox
    outbox: /var/opt/dans.knaw.nl/tmp/integrity-check/outbox
    minimalFrequency: 30days
  checksumCalculation:
    pollingInterval: 1s
    scheduling:
      startAfter: '00:00'
      startBefore: '06:00'
      batchSize: 10
    download:
      # N.B. the service will use in-memory buffers to read the chunks, so do not set this too high.
      chunkSize: 128Mb
      retries: 20
      waitBetweenRetries: 10s
    taskExecutor:
      nameFormat: "integrity-check-worker-%d"
      maxQueueSize: 5000
      minThreads: 3
      maxThreads: 3
      keepAliveTime: 60 seconds

#
# See https://www.dropwizard.io/en/latest/manual/configuration.html#logging
#
logging:
  level: INFO
  appenders:
    - type: file
      archive: false
      timeZone: system
      currentLogFilename: /var/opt/dans.knaw.nl/log/dd-integrity-check/dd-integrity-check.log
    - type: console
      # Used in combination with journald, which already adds the timestamp
      logFormat: "%-5p %c{0} [%t]: %m%n%dwREx"
  loggers:
    'org.hibernate.engine.internal.StatisticalLoggingSessionEventListener': 'OFF'
    'audit-log':
      additive: false
      appenders:
        - type: file
          archive: false
          timeZone: system
          currentLogFilename: /var/opt/dans.knaw.nl/log/dd-integrity-check/audit.log
          logFormat: "%d{ISO8601} %m%n"
